; XT-AT-PC-RGB-LED v2 configuration
; Build the EEPROM file:  python3 tools/make_eeprom.py config.ini eeprom.hex
; Then write eeprom.hex into the EEPROM of the ATtiny (e.g. with the XGecu T48).

[led]
; GRB for WS2812B, RGB for APA106 / PL9823 (5 mm through-hole)
order = RGB
; number of LEDs in the chain, all show the same colour
count = 1
; 0..255
brightness = 128
; plain RGB LED output (ATtiny84 board only): none, common_anode, common_cathode
rgb_output = common_anode

[colours]
; R,G,B (0..255) or #RRGGBB
power = 0,255,0
turbo = 255,0,0
hdd = 0,0,255

[behaviour]
; minimum time the HDD colour stays on, 0..2550 ms in 10 ms steps
hdd_hold_ms = 50
; replace = turbo colour instead of power colour, mix = both added
turbo_mode = replace
